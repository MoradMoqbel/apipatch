# ── ApiPatch Webhook Server — docker-compose.yml ─────────────────────────────
# Usage:
#   1. Copy .env.example to .env and fill in your keys
#   2. docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

version: '3.9'

services:
  apipatch-webhook:
    build: .
    image: apipatch:latest
    container_name: apipatch_webhook
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # ── AI Provider (choose one, rest can stay blank) ──────────────────────
      - GEMINI_API_KEY=
      - OPENAI_API_KEY=
      - ANTHROPIC_API_KEY=
      # ── GitHub ────────────────────────────────────────────────────────────
      - GITHUB_TOKEN=
      - GITHUB_WEBHOOK_SECRET=
      # ── AI Provider Selection (optional — auto-detected from keys above) ──
      - APIPATCH_PROVIDER=
      # ── Telemetry opt-out (uncomment to disable) ──────────────────────────
      # - APIPATCH_NO_TELEMETRY=1
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Limit resources to prevent runaway LLM threads
    deploy:
      resources:
        limits:
          memory: 512M
