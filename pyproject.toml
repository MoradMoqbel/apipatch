[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apipatch"
version = "0.2.0"
description = "Autonomous AI Agent for API Breaking Changes & Self-Maintaining Codebases"
readme = "README.md"
authors = [{ name = "Morad Moqbel" }]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["api", "deprecation", "breaking-changes", "refactoring", "ai-agent", "github", "codemod"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.optional-dependencies]
ai = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-genai>=0.1.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
apipatch = "apipatch.cli:main"

[tool.setuptools.packages.find]
include = ["apipatch*"]
