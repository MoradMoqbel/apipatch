[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apipatch"
version = "0.3.3"
description = "Autonomous AI Agent that detects and fixes deprecated API calls in Python, JS, TS via LLM-powered Pull Requests"
readme = "README.md"
authors = [{ name = "Morad Moqbel", email = "moradmoqbel@gmail.com" }]
license = "MIT"
requires-python = ">=3.9"
keywords = [
    "api", "deprecation", "breaking-changes", "refactoring", "ai-agent",
    "codemod", "github", "autonomous", "llm", "openai", "pydantic", "migration",
    "typescript", "javascript", "dependabot"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/MoradMoqbel/apipatch"
Repository = "https://github.com/MoradMoqbel/apipatch"
Bug-Tracker = "https://github.com/MoradMoqbel/apipatch/issues"

[project.optional-dependencies]
ai = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-genai>=0.1.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
apipatch = "apipatch.cli:main"

[tool.setuptools.packages.find]
include = ["apipatch*"]
