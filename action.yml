name: 'ApiPatch AI Migration Agent'
description: 'Autonomous AI agent that detects breaking API changes and fixes code logic via Pull Requests in CI/CD'
author: 'Morad Moqbel'
branding:
  icon: 'zap'
  color: 'green'

inputs:
  path:
    description: 'Path to scan or fix (default: current workspace)'
    required: false
    default: '.'
  mode:
    description: 'Execution mode: "scan" (audit only) or "fix" (refactor in-place)'
    required: false
    default: 'scan'
  provider:
    description: 'AI Provider for LLM reasoning (gemini, openai, anthropic, bedrock)'
    required: false
    default: 'gemini'
  api_key:
    description: 'API key for the selected AI provider'
    required: false
    default: ''
  model:
    description: 'Specific LLM model to use'
    required: false
    default: ''
  concurrency:
    description: 'Number of parallel worker threads'
    required: false
    default: '6'
  github_token:
    description: 'GitHub Token for opening Pull Requests (defaults to github.token)'
    required: false
    default: ${{ github.token }}
  auto_pr:
    description: 'Whether to automatically create a Pull Request with fixes if breaking changes are found (in "fix" mode)'
    required: false
    default: 'true'
  pr_title:
    description: 'Custom Pull Request title'
    required: false
    default: '[ApiPatch] Autonomous API Breaking Changes Migration'
  pr_branch:
    description: 'Branch name for automated Pull Request'
    required: false
    default: 'apipatch/auto-migration'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install ApiPatch
      shell: bash
      run: |
        pip install --upgrade apipatch

    - name: Run ApiPatch Audit / Refactor
      id: run_apipatch
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.api_key }}
        OPENAI_API_KEY: ${{ inputs.api_key }}
        ANTHROPIC_API_KEY: ${{ inputs.api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        ARGS=""
        if [ -n "${{ inputs.provider }}" ]; then
          ARGS="$ARGS --provider ${{ inputs.provider }}"
        fi
        if [ -n "${{ inputs.api_key }}" ]; then
          ARGS="$ARGS --api-key ${{ inputs.api_key }}"
        fi
        if [ -n "${{ inputs.model }}" ]; then
          ARGS="$ARGS --model ${{ inputs.model }}"
        fi
        if [ -n "${{ inputs.concurrency }}" ]; then
          ARGS="$ARGS -c ${{ inputs.concurrency }}"
        fi

        if [ "${{ inputs.mode }}" = "fix" ]; then
          echo "Running ApiPatch in FIX mode..."
          apipatch fix "${{ inputs.path }}" --write $ARGS -o apipatch-report.json
        else
          echo "Running ApiPatch in SCAN mode..."
          apipatch scan "${{ inputs.path }}" $ARGS -o apipatch-report.json
        fi

    - name: Generate GitHub Step Summary
      shell: bash
      run: |
        if [ -f apipatch-report.json ]; then
          echo "### ⚡ ApiPatch Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat apipatch-report.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi

    - name: Create Pull Request with Fixes
      if: ${{ inputs.mode == 'fix' && inputs.auto_pr == 'true' }}
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ inputs.github_token }}
        commit-message: 'fix: autonomous API breaking changes migration via ApiPatch'
        title: ${{ inputs.pr_title }}
        body: |
          ## ⚡ ApiPatch Autonomous Migration

          ApiPatch detected deprecated third-party API calls in this repository and automatically refactored them to modern signatures grounded in official documentation and verified via AST.

          ### 🤖 Generated by:
          [ApiPatch](https://github.com/MoradMoqbel/apipatch) - Self-maintaining APIs that fix broken code via PRs.
        branch: ${{ inputs.pr_branch }}
        delete-branch: true
