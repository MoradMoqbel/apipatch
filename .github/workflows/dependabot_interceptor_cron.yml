name: 'Autonomous Dependabot Interceptor Daemon'

on:
  schedule:
    # Run autonomously in GitHub Cloud every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sweep-and-radar:
    name: 'Autonomous Breaking-Change Interceptor'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Autonomous Dependabot Sweep (Filtered by Stars)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Starting Autonomous Dependabot Interceptor Sweep..."
          python -m apipatch intercept sweep --min-stars 15 --max 4 --output front/vault_data.json

      - name: Commit and Push Updated Vault Leads
        run: |
          git config --global user.name "ApiPatch Autonomous Bot"
          git config --global user.email "bot@apipatch.dev"
          git add front/vault_data.json
          if git diff --staged --quiet; then
            echo "No new breaking changes detected in this cycle."
          else
            git commit -m "chore(vault): autonomous dependabot intercept sweep [skip ci]"
            git push origin main
          fi
